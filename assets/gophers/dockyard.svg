<svg viewBox="0 0 256 256" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="gopher-clip">
      <rect x="0" y="0" width="256" height="120" />
    </clipPath>
  </defs>

  <!-- Background Crane Structure -->
  <!-- Crane Tower -->
  <rect x="214" y="20" width="20" height="190" fill="#90A4AE" />
  <rect x="218" y="20" width="12" height="190" fill="#78909C" />
  
  <!-- Crane Arm -->
  <rect x="20" y="20" width="214" height="12" fill="#78909C" rx="2" />
  <rect x="20" y="24" width="214" height="4" fill="#546E7A" />

  <!-- Crane Trolley -->
  <rect x="42" y="28" width="172" height="8" fill="#37474F" rx="2" />

  <!-- Crane Hoist Cables -->
  <!-- Set slightly inward from the container edges -->
  <line x1="52" y1="36" x2="52" y2="120" stroke="#37474F" stroke-width="3" />
  <line x1="204" y1="36" x2="204" y2="120" stroke="#37474F" stroke-width="3" />

  <!-- Cargo Ship Hull -->
  <!-- Deck Base -->
  <path d="M 10 210 L 256 210 L 246 256 L 0 256 Z" fill="#263238" />
  <!-- Ship Top Stripe -->
  <path d="M 10 210 L 256 210 L 254 216 L 8 216 Z" fill="#E53935" />
  <!-- Water Waves -->
  <path d="M 0 242 Q 32 232 64 242 T 128 242 T 192 242 T 256 242 L 256 256 L 0 256 Z" fill="#0288D1" opacity="0.9" />

  <!-- Shadow on the deck below the hanging container -->
  <rect x="68" y="218" width="120" height="6" fill="#1C262B" rx="3" opacity="0.5" />

  <!-- Classic Gopher -->
  <g clip-path="url(#gopher-clip)">
    <!-- Body -->
    <path d="M 78 140 C 78 40, 178 40, 178 140 Z" fill="#00ADD8" />
    
    <!-- Hard Hat Dome -->
    <path d="M 70 50 C 70 -10, 186 -10, 186 50 Z" fill="#FFC107" />
    <!-- Hard Hat Brim -->
    <rect x="58" y="46" width="140" height="10" rx="5" fill="#FF9800" />
    
    <!-- Eyes -->
    <circle cx="106" cy="76" r="16" fill="white" />
    <circle cx="150" cy="76" r="16" fill="white" />
    <!-- Pupils -->
    <circle cx="112" cy="76" r="6" fill="black" />
    <circle cx="144" cy="76" r="6" fill="black" />
    
    <!-- Nose -->
    <ellipse cx="128" cy="92" rx="10" ry="6" fill="black" />
    
    <!-- Teeth -->
    <rect x="117" y="96" width="10" height="16" fill="white" rx="2" />
    <rect x="129" y="96" width="10" height="16" fill="white" rx="2" />
  </g>

  <!-- Shipping Container (No Text) -->
  <rect x="48" y="120" width="160" height="70" fill="#E95420" rx="2" />
  
  <!-- Container Ribs -->
  <rect x="60" y="120" width="8" height="70" fill="#C84113" />
  <rect x="76" y="120" width="8" height="70" fill="#C84113" />
  <rect x="92" y="120" width="8" height="70" fill="#C84113" />
  <rect x="108" y="120" width="8" height="70" fill="#C84113" />
  <rect x="124" y="120" width="8" height="70" fill="#C84113" />
  <rect x="140" y="120" width="8" height="70" fill="#C84113" />
  <rect x="156" y="120" width="8" height="70" fill="#C84113" />
  <rect x="172" y="120" width="8" height="70" fill="#C84113" />
  <rect x="188" y="120" width="8" height="70" fill="#C84113" />

  <!-- Container Top Rim -->
  <rect x="48" y="120" width="160" height="4" fill="#BF360C" opacity="0.6" />
</svg>